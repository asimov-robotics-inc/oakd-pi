[project]
name = "oakd-capture"
version = "0.4.0"
description = "Egocentric data capture kit using OAK-D Pro for robotics training"
requires-python = ">=3.11"
dependencies = [
    "depthai>=3.0.0",
    "mcap>=1.1.0",
]

[project.optional-dependencies]
viewer = ["opencv-python", "av"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakd_capture"]
