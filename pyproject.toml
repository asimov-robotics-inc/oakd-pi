[project]
name = "oakd-capture"
version = "0.1.1"
description = "Egocentric data capture kit using OAK-D Pro for robotics training"
requires-python = ">=3.11"
dependencies = [
    "depthai>=3.0.0",
    "gpiozero>=2.0",
    "lgpio>=0.2.2",
    "mcap>=1.1.0",
    "opencv-python-headless>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakd_capture"]
